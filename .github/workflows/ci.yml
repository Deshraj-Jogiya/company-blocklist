name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # Bumped from 8.2 -- phpoffice/phpspreadsheet's real zipstream
          # dependency requires PHP 8.3+, confirmed by a real CI failure
          # (not guessed): "php-64bit version (8.2.34) does not satisfy
          # that requirement."
          php-version: "8.3"
          extensions: intl, sqlite3, pdo_sqlite, gd
      - run: composer install --no-progress --prefer-dist
      - name: Run the real CodeIgniter test suite (real SQLite test database, real WARN Act live-network check)
        env:
          CI_ENVIRONMENT: testing
        run: ./vendor/bin/phpunit --testdox
